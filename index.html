<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A.R.D.O.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cronômetro A.R.D.O.</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--prep:#c8d12e;--work:#3d8fcb;--rest:#d9534f;--done:#2e9e5b;--fg:#f2f2f2;--mut:#8d8d8d;--card:#171717;--line:#2a2a2a;
--cur:#c8d12e;--on-cur:#141414;--nxt:#3d8fcb;--on-nxt:#fff;--accent:#c8d12e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
font-family:'Bebas Neue','Oswald','Barlow Condensed','Roboto Condensed','Arial Narrow',Impact,sans-serif;letter-spacing:.03em;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:58px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.brand span{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{text-align:center;line-height:1;flex:none;color:var(--accent)}
.mid small{font-size:16px;display:block}
.mid b{display:block;font-size:34px;font-weight:400}
.icons{flex:1;display:flex;justify-content:flex-end;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px}
#stage{flex:1;min-height:0;position:relative;background:var(--cur);color:var(--on-cur);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:background .2s}
#wm{position:absolute;left:50%;top:50%;width:min(80vw,62vh);height:min(80vw,62vh);transform:translate(-50%,-50%);object-fit:contain;opacity:.13;border-radius:50%;pointer-events:none}
#phase{font-size:min(14vw,10vh);line-height:1;position:relative;text-align:center;padding:0 8px}
#big{font-size:min(38vw,34vh);line-height:.9;position:relative}
#next{background:var(--nxt);color:var(--on-nxt);text-align:center;padding:10px 8px;line-height:1.05}
#next small{display:block;font-size:min(7vw,4.6vh)}
#next b{display:block;font-size:min(15vw,8.5vh);font-weight:400}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px 10px}
.stat{text-align:center;line-height:1}
.stat b{display:block;font-size:min(20vw,10vh);font-weight:400}
.stat small{font-size:min(4.2vw,2.6vh);color:#d8d8d8;display:block;margin-top:4px}
#sL b{color:var(--work)}#sR b{color:var(--prep)}
.playwrap{text-align:center;color:var(--cur)}
.play{width:min(27vw,13vh);height:min(27vw,13vh);min-width:84px;min-height:84px;border-radius:50%;border:0;background:var(--cur);color:var(--on-cur);display:grid;place-items:center;box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 8px var(--on-cur);padding:0}
.play svg{width:42%;height:42%}
.play:disabled{opacity:.35}
#playLbl{display:block;margin-top:6px;font-size:min(6vw,3.6vh)}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:30px;height:30px}
nav button.on{color:#fff}
/* sheet / dialog */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top)}
.sh-top{position:sticky;top:0;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px;z-index:2;border-bottom:1px solid var(--line)}
.sh-top button{background:none;border:0;font-size:20px;padding:6px}
.sh-top .c{color:var(--mut);justify-self:start}.sh-top .g{color:#5fd16f;justify-self:end}
.sh-top h2{margin:0;font-weight:400;font-size:22px}
.sh-body{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.fld{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.fld .l{font-size:24px}.fld .d{font-family:'Oswald',sans-serif;font-size:13px;color:var(--mut);letter-spacing:0;grid-column:1}
.stp{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.stp button{width:40px;height:40px;border-radius:50%;border:2px solid #555;background:none;font-size:24px;line-height:1;padding:0;touch-action:manipulation}
.stp input{width:92px;text-align:center;background:#1d1d1d;border:1px solid #333;border-radius:8px;color:#fff;font:inherit;font-size:32px;padding:2px 0;-webkit-user-select:text;user-select:text}
.txt{width:100%;background:#1d1d1d;border:1px solid #333;border-radius:8px;color:#fff;font:inherit;font-size:22px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.h3{font-size:20px;color:var(--mut);margin:26px 0 10px}
.btn{background:var(--prep);color:#141414;border:0;border-radius:10px;padding:12px 16px;font-size:20px}
.btn.o{background:none;color:#fff;border:2px solid #555}
.btn.w{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card .in{flex:1;min-width:0}
.card h4{margin:0 0 4px;font-weight:400;font-size:22px}
.card p{margin:0;font-family:'Oswald',sans-serif;font-size:13px;color:#bbb;letter-spacing:0}
.card .x{background:none;border:0;color:#c66;font-size:22px}
#dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:20px}
#dlg .bx{background:#222;width:min(420px,100%);border-radius:6px;overflow:hidden;text-align:center}
#dlg p{margin:0;padding:26px 18px;font-size:26px;line-height:1.1}
#dlg .bt{display:grid;grid-template-columns:1fr 1fr}
#dlg .bt button{border:0;background:#ddd;color:#111;font-size:20px;padding:18px}
#dlg .bt button+button{border-left:2px solid #222}
/* stopwatch */
#swstage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--work);color:var(--on-cur);position:relative;overflow:hidden}
#swbig{font-size:min(26vw,24vh);line-height:.95;position:relative}
#swlaps{max-height:26vh;overflow:auto;width:min(420px,90%);margin-top:8px;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:0;position:relative}
#swlaps div{display:flex;justify-content:space-between;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.25)}
.swbtns{display:flex;gap:14px;justify-content:center;padding:14px}
.swbtns .btn{min-width:110px;font-size:24px;padding:14px}
/* more */
#v-more .sh-body{overflow:auto;flex:1;width:100%}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px}
.tg input{width:26px;height:26px}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cp{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:10px;padding:8px 12px;font-size:19px}
.cp input{width:44px;height:34px;border:0;background:none;padding:0}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.th{display:flex;gap:3px;align-items:center;border:2px solid #444;border-radius:10px;padding:6px 8px;background:none;font-size:16px}
.th i{width:14px;height:14px;border-radius:50%;display:inline-block}
.lg{display:flex;align-items:center;gap:12px;margin:10px 0}
.lg img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#222}
input[type=range]{width:100%}

/* ---- paisagem (TV / celular espelhado) ---- */
@media (min-aspect-ratio:13/10){
 #v-timer.on{display:grid;grid-template-columns:minmax(0,1fr) min(36%,420px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage next" "stage ctrl"}
 #v-timer .top{grid-area:top;min-height:46px;padding:4px 12px}
 #v-timer .ib{width:36px;height:36px}
 .mid b{font-size:30px}
 #stage{grid-area:stage}
 #next{grid-area:next;display:flex;flex-direction:column;justify-content:center;padding:6px}
 .ctrl{grid-area:ctrl;grid-template-columns:1fr 1fr;padding:8px;align-content:center}
 .playwrap{grid-column:1/3;grid-row:1;display:flex;align-items:center;justify-content:center;gap:14px}
 .play{width:min(22vh,110px);height:min(22vh,110px);min-width:70px;min-height:70px}
 #playLbl{margin:0;font-size:min(8vh,30px)}
 #phase{font-size:min(9vw,15vh)}
 #big{font-size:min(30vw,52vh)}
 #next small{font-size:min(3.4vw,6vh)}#next b{font-size:min(7vw,14vh)}
 .stat b{font-size:min(9vw,16vh)}.stat small{font-size:min(2vw,3.6vh)}
 nav button{flex-direction:row;justify-content:center;gap:8px;padding:5px 0;font-size:13px}
 nav button svg{width:22px;height:22px}
 body.run nav{display:none}
 #swbig{font-size:min(20vw,40vh)}
}
.snd{padding:12px 0;border-bottom:1px solid var(--line)}
.sl{font-size:20px;margin-bottom:8px}
.sr{display:flex;gap:10px}
.sr select{flex:1;min-width:0;background:#1d1d1d;color:#fff;border:1px solid #333;border-radius:8px;font:inherit;font-size:20px;padding:10px}
.pv{width:52px;flex:none;border-radius:8px;border:0;background:var(--work);color:#fff;font-size:20px}

/* ---- tela cheia deitado (padrão das fotos) ---- */
#land{display:none}
@media (min-aspect-ratio:13/10){
 #v-timer.on{display:flex!important}
 #v-timer.on>:not(#land){display:none!important}
 #v-timer.on #land{display:flex}
 body.vt nav{display:none}
}
#land{position:relative;flex:1;min-height:0;flex-direction:column;background:var(--cur);color:var(--on-cur);transition:background .2s;
 padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#lwm{position:absolute;left:50%;top:50%;height:96%;aspect-ratio:1;transform:translate(-50%,-50%);object-fit:contain;opacity:.13;pointer-events:none;z-index:0}
.lt,#lbig,.lbt{position:relative;z-index:1}
.lt{display:flex;align-items:center;gap:2.2vw;height:15vh;padding:1.6vh 1.6vw 0;white-space:nowrap}
.lb{flex:none;width:11vh;height:11vh;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.lb svg{width:52%;height:52%}
.llogo{flex:none;width:11vh;height:11vh;border-radius:50%;box-shadow:0 .3vh 1.2vh rgba(0,0,0,.35)}
.ltt{font-size:8.5vh;opacity:.8}
.lph{font-size:12.5vh;flex:1;overflow:hidden;text-overflow:ellipsis}
#lbig{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lTime{line-height:.8;white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-block}
.lbt{display:flex;align-items:stretch;height:14vh;font-size:9.5vh;white-space:nowrap}
.lbt>span{display:flex;align-items:center}
.lbt .bx{background:#0d0d0d;color:var(--work);padding:0 2.4vw;font-size:12vh;border-top-right-radius:1.2vh}
.lbt .bx2{color:#fff;border-radius:0;border-top-left-radius:1.2vh}
.lbt .as{padding:0 1.8vw}
.lbt .pill{background:var(--nxt);color:var(--on-nxt);padding:0 1.8vw}
.lbt .sp{flex:1}
</style>
</head>
<body>
<div id="app">
  <!-- TIMER -->
  <section class="view on" id="v-timer">
    <div class="top">
      <div class="brand"><img class="blogo" alt=""><span class="bname"></span></div>
      <div class="mid"><small id="title">TABATA</small><b id="total">00:00</b></div>
      <div class="icons">
        <button class="ib" id="bGear" aria-label="Configurar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
        <button class="ib" id="bReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      </div>
    </div>
    <div id="stage"><img id="wm" alt=""><div id="phase">PREPARAR</div><div id="big">00:00</div></div>
    <div id="next"><small id="nxL">EXERCÍCIO:</small><b id="nxT">03:00</b></div>
    <div class="ctrl">
      <div class="stat" id="sL"><b>6</b><small>RONDAS RESTANTES</small></div>
      <div class="playwrap"><button class="play" id="bPlay" aria-label="Iniciar"></button><span id="playLbl">INICIAR</span></div>
      <div class="stat" id="sR"><b>1</b><small>CICLOS RESTANTES</small></div>
    </div>
    <div id="land"><img id="lwm" alt="">
      <div class="lt">
        <button class="lb" id="lReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
        <img class="llogo" id="lLogo" alt="">
        <span class="ltt" id="lTot">TABATA 00:00</span>
        <span class="lph" id="lPh">PREPARAR</span>
        <button class="lb" id="lFs" aria-label="Tela cheia" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="lb" id="lPlay" aria-label="Iniciar ou pausar"></button>
      </div>
      <div id="lbig"><span id="lTime">00:00</span></div>
      <div class="lbt">
        <span class="bx" id="lRd">6</span>
        <span class="as" id="lAs">A SEGUIR</span>
        <span class="pill" id="lNx">EXERCÍCIO: 03:00</span>
        <span class="sp"></span>
        <span class="bx bx2" id="lCy">1</span>
      </div>
    </div>
  </section>
  <!-- STOPWATCH -->
  <section class="view" id="v-sw">
    <div class="top"><div class="brand"><img class="blogo" alt=""><span class="bname"></span></div><div class="mid"><small>CRONÔMETRO</small></div><div class="icons"></div></div>
    <div id="swstage"><img class="wm2" id="wm2" alt="" style="position:absolute;left:50%;top:50%;width:min(80vw,62vh);height:min(80vw,62vh);transform:translate(-50%,-50%);object-fit:contain;opacity:.1;border-radius:50%;pointer-events:none"><div id="swbig">00:00.0</div><div id="swlaps"></div></div>
    <div class="swbtns"><button class="btn o" id="swLap">VOLTA</button><button class="btn" id="swGo">INICIAR</button><button class="btn o" id="swReset">ZERAR</button></div>
  </section>
  <!-- MORE -->
  <section class="view" id="v-more">
    <div class="top"><div class="brand"><img class="blogo" alt=""><span class="bname"></span></div><div class="mid"><small>MAIS</small></div><div class="icons"></div></div>
    <div class="sh-body" id="moreBody"></div>
  </section>
  <nav id="nav">
    <button data-n="tabata"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="17" r="10"/><path d="M13 3h6M17 11l-3 7h4l-3 6"/></svg>TABATA</button>
    <button data-n="rounds"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="11"/><path d="M16 16 9 9"/></svg>ROUNDS</button>
    <button data-n="sw"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="1.5"/></svg>CRONÔMETRO</button>
    <button data-n="more"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 5a11 11 0 1 1-11 11"/></svg>MAIS</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="dlg" hidden></div>

function build(){const c=S[mode];segs=[];let t=0;
 const add=(type,d,r,cy)=>{if(d>0){segs.push({type,d,r,c:cy,s:t*1000,e:(t+d)*1000});t+=d}};
 if(mode==='countdown')add('work',c.work,1,1);
 else{add('prep',c.prep,1,1);
  for(let cy=1;cy<=c.cycles;cy++)for(let r=1;r<=c.rounds;r++){add('work',c.work,r,cy);
   if(!(cy===c.cycles&&r===c.rounds)){if(r<c.rounds)add('rest',c.rest,r,cy);else add('cycleRest',c.cycleRest>0?c.cycleRest:c.rest,r,cy)}}}

const elapsed=()=>running?Math.min(total,el+performance.now()-t0):el;
const curIdx=e=>{for(let i=0;i<segs.length;i++)if(e<segs[i].e)return i;return Math.max(0,segs.length-1)};
function cue(type){if(type==='prep')snd.prep();else if(type==='work')snd.work();else snd.rest();vib(type==='work'?[300]:[120,80,120])}

 if(i!==idx0){idx0=i;cue(segs[i].type);lastKey=i+'-'+rem}
